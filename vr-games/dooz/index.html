<script>
/* VR kit: shared engine for the Quest WebXR games. Exposes window.K */
(function(){
'use strict';
const K = window.K = {};
const V = K.V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);

K.basic = (c, o={}) => new THREE.MeshBasicMaterial(Object.assign({color:c}, o));
K.std = (c, ei=.2, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, emissive:c, emissiveIntensity:ei, roughness:.5, metalness:.1}, o));

const F_DISP = 'Lalezar, Vazirmatn, Tahoma, sans-serif', F_BODY = 'Vazirmatn, Tahoma, sans-serif';
K.F_DISP = F_DISP; K.F_BODY = F_BODY;

/* ---------- geometry helpers ---------- */
const _ab = V(), _ap = V(), _c = V(), _a = V(), _b = V();
K.segDist = function(p,a,b){ _ab.subVectors(b,a); const t = K.clamp(_ap.subVectors(p,a).dot(_ab)/Math.max(_ab.lengthSq(),1e-6),0,1); return _c.copy(a).addScaledVector(_ab,t).distanceTo(p); };
K.sweptDist = function(p,H){ let m = 1e9; for (let k=0;k<=3;k++){ const f = k/3; _a.lerpVectors(H.prevBase,H.base,f); _b.lerpVectors(H.prevTip,H.tip,f); m = Math.min(m, K.segDist(p,_a,_b)); } return m; };

/* ---------- CSS + overlay ---------- */
function injectUI(cfg){
  const c = Object.assign({bg:'#0b0d1c', ink:'#eeeaff', muted:'#a39fc4', accent:'#7c5cff', accent2:'#ff4d6d'}, cfg.colors || {});
  const st = document.createElement('style');
  st.textContent = `
:root{--bg:${c.bg};--ink:${c.ink};--muted:${c.muted};--accent:${c.accent};--accent2:${c.accent2};--panel:rgba(10,10,24,.8);--line:rgba(255,255,255,.16);
--display:Lalezar,Vazirmatn,Tahoma,sans-serif;--body:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}body{margin:0;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0}#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{position:fixed;inset:0;overflow:auto;display:grid;place-items:center;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.card{width:100%;max-width:540px;display:flex;flex-direction:column;gap:16px;text-align:right}

.back:hover{color:var(--ink);border-color:var(--accent)}
.eyebrow{margin:0;color:var(--muted);font-size:13px}
.logo{margin:0;font:400 clamp(52px,14vw,92px)/1.05 var(--display);color:var(--accent);text-shadow:0 0 22px color-mix(in srgb,var(--accent) 55%,transparent);text-wrap:balance}
.lede{margin:0;font-size:16px;line-height:1.9;max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:600 16px/1 var(--body);color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:15px 20px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.note{margin:0;font-size:13.5px;line-height:1.8;color:var(--muted);border-right:3px solid var(--accent);padding-right:10px}
.how{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.how h2{margin:0 0 10px;font:400 22px/1 var(--display)}
.how ul{margin:0;padding:0 18px 0 0;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.75}
.how li::marker{color:var(--accent)}
.how .desk{margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.7}
#bMenu{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));font:600 14px/1 var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}
#hint{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:center;direction:rtl;pointer-events:none}`;
  document.head.appendChild(st);
  const stage = document.createElement('div'); stage.id = 'stage'; document.body.appendChild(stage);
  const ov = document.createElement('div'); ov.id = 'ov'; ov.dir = 'rtl';
  ov.innerHTML = `<main class="card">
    ${cfg.hub === false ? '' : '<a class="back" href="../index.html">→ همهٔ بازی‌ها</a>'}
    <p class="eyebrow">${cfg.eyebrow || 'بازی واقعیت مجازی برای Meta Quest 3S'}</p>
    <h1 class="logo">${cfg.title}</h1>
    <p class="lede">${cfg.tagline}</p>
    <div class="actions"><button id="bVR" class="btn primary" disabled>ورود به واقعیت مجازی</button><button id="bDesk" class="btn">${cfg.deskLabel || 'تمرین با موس'}</button></div>
    <p id="xrNote" class="note">در حال بررسی پشتیبانی WebXR…</p>
    <section class="how"><h2>طرز بازی</h2><ul>${cfg.rules.map(r => `<li>${r}</li>`).join('')}</ul>${cfg.deskRules ? `<p class="desk">با موس: ${cfg.deskRules}</p>` : ''}</section>
  </main>`;
  document.body.appendChild(ov);
  const bm = document.createElement('button'); bm.id = 'bMenu'; bm.hidden = true; bm.textContent = 'منو'; document.body.appendChild(bm);
  const hint = document.createElement('div'); hint.id = 'hint'; hint.hidden = true; hint.textContent = cfg.deskRules || ''; document.body.appendChild(hint);
  return stage;
}

/* ---------- audio ---------- */
K.audio = function(){
  if (!K.ac){
    const ac = K.ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4; comp.connect(ac.destination);
    K.master = ac.createGain(); K.master.gain.value = .9; K.master.connect(comp);
    K.sfx = ac.createGain(); K.sfx.gain.value = .8; K.sfx.connect(K.master);
    K.mus = ac.createGain(); K.mus.gain.value = .7; K.mus.connect(K.master);
    K.noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = K.noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    K.cfg.onAudio && K.cfg.onAudio(K);
  }
  if (K.ac.state === 'suspended') K.ac.resume();
  return K.ac;
};
K.mtof = m => 440*Math.pow(2,(m-69)/12);
K.env = function(g,t,peak,dec,att=.004){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+att); g.gain.exponentialRampToValueAtTime(.0001,t+att+dec); };
K.tone = function(o){
  if (!K.ac) return; const ac = K.ac, t = o.t != null ? o.t : ac.currentTime;
  const osc = ac.createOscillator(), g = ac.createGain(); osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f, t); if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + (o.slide || o.dec || .1));
  if (o.detune) osc.detune.value = o.detune;
  K.env(g, t, o.peak != null ? o.peak : .2, o.dec || .2, o.att);
  let node = osc;
  if (o.lp){ const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 1; node.connect(f); node = f; }
  node.connect(g); g.connect(o.dest || K.sfx); osc.start(t); osc.stop(t + (o.att||.004) + (o.dec||.2) + .05);
};
K.noise = function(o){
  if (!K.ac) return; const ac = K.ac, t = o.t != null ? o.t : ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = K.noiseBuf; const f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1000, t); if (o.freq2) f.frequency.exponentialRampToValueAtTime(o.freq2, t + (o.dec || .2)); f.Q.value = o.q || 1;
  K.env(g, t, o.peak != null ? o.peak : .3, o.dec || .2, o.att);
  s.connect(f); f.connect(g); g.connect(o.dest || K.sfx); s.start(t); s.stop(t + (o.att||.004) + (o.dec||.2) + .05);
};
K.click = () => { K.tone({type:'triangle', f:880, f2:1320, dec:.06, peak:.12}); };

/* ---------- init ---------- */
K.init = function(cfg){
  K.cfg = cfg;
  const stage = injectUI(cfg);
  const renderer = K.renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  if (cfg.shadows){ renderer.shadowMap.enabled = true; }
  stage.appendChild(renderer.domElement);
  const scene = K.scene = new THREE.Scene();
  scene.background = new THREE.Color(cfg.bg != null ? cfg.bg : 0x0b0d1c);
  if (cfg.fog) scene.fog = new THREE.Fog(cfg.bg != null ? cfg.bg : 0x0b0d1c, cfg.fog[0], cfg.fog[1]);
  const rig = K.rig = new THREE.Group(); scene.add(rig);
  const camera = K.camera = new THREE.PerspectiveCamera(cfg.fov || 62, innerWidth/innerHeight, .03, 400);
  rig.add(camera);
  K.resetCamera = function(){
    const dc = cfg.deskCam || {pos:[0,1.55,1.2], look:[0,1.3,-2]};
    camera.position.set(...dc.pos); camera.quaternion.identity(); camera.lookAt(V(...dc.look).add(rig.position));
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  };

  if (cfg.lights !== false){
    K.hemi = new THREE.HemisphereLight(0xdde4ff, 0x22202e, .85); scene.add(K.hemi);
    K.sun = new THREE.DirectionalLight(0xffffff, .75); K.sun.position.set(1.5,4,2.5); scene.add(K.sun);
  }
  K.head = V(); K.headDir = V(0,0,-1);

  /* hands */
  K.hands = [0,1].map(h => {
    const holder = new THREE.Group();
    const H = {h, holder, ctrl:null, src:null, active:false,
      tipL: V(...(cfg.tip ? cfg.tip(h) : [0,0,0])), baseL: V(...(cfg.base ? cfg.base(h) : (cfg.tip ? cfg.tip(h) : [0,0,0]))),
      tip:V(), base:V(), prevTip:V(), prevBase:V(), vel:V(), speed:0, pos:V(), prevPos:V(), pvel:V(), quat:new THREE.Quaternion(), dir:V(0,0,-1),
      btn:{trigger:false, squeeze:false, a:false, b:false}, down:{}, up:{}, axes:[0,0], init:false,
      buzz(a,ms){ try { const hp = H.src && H.src.gamepad && H.src.gamepad.hapticActuators && H.src.gamepad.hapticActuators[0]; if (hp && hp.pulse) hp.pulse(a, ms); } catch(e){} }};
    if (cfg.hand){ const m = cfg.hand(h, K); if (m) holder.add(m); H.model = m; }
    return H;
  });
  K.L = K.hands[0]; K.R = K.hands[1];
  const rayGeo = new THREE.BufferGeometry().setFromPoints([V(0,0,0), V(0,0,-1)]);
  const rayMat = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:.55});
  for (let i=0;i<2;i++){
    const c = renderer.xr.getController(i); rig.add(c);
    const line = new THREE.Line(rayGeo, rayMat); line.scale.z = 3; line.visible = false; c.add(line); c.userData.line = line;
    c.addEventListener('connected', e => {
      const hd = e.data && e.data.handedness; const h = hd === 'left' ? 0 : hd === 'right' ? 1 : i;
      const H = K.hands[h]; if (H.ctrl && H.ctrl !== c) H.ctrl.remove(H.holder);
      c.add(H.holder); H.ctrl = c; H.src = e.data; H.active = true; H.init = false; H.holder.visible = true;
      cfg.onConnect && cfg.onConnect(H);
    });
    c.addEventListener('disconnected', () => { for (const H of K.hands) if (H.ctrl === c){ c.remove(H.holder); H.ctrl = null; H.src = null; H.active = false; } });
  }

  /* desktop pointer */
  K.mouse = {ndc:new THREE.Vector2(.1,-.1), down:false, right:false, ray:new THREE.Raycaster(), keys:{}, dragDX:0, dragDY:0};
  const el = renderer.domElement;
  let lastX = 0, lastY = 0;
  el.addEventListener('pointermove', e => { const r = el.getBoundingClientRect(); K.mouse.ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); if (K.mouse.down || K.mouse.right){ K.mouse.dragDX += e.clientX - lastX; K.mouse.dragDY += e.clientY - lastY; } lastX = e.clientX; lastY = e.clientY; });
  el.addEventListener('pointerdown', e => { K.audio(); lastX = e.clientX; lastY = e.clientY; if (e.button === 2) K.mouse.right = true; else K.mouse.down = true; try { el.setPointerCapture(e.pointerId); } catch(_){} pointerClick(); });
  addEventListener('pointerup', e => { if (e.button === 2) K.mouse.right = false; else K.mouse.down = false; });
  el.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => { K.mouse.keys[e.code] = true; if (K.mode === 'desk' && e.key === 'Escape') toOverlay(); cfg.onKey && K.mode === 'desk' && cfg.onKey(e, K); });
  addEventListener('keyup', e => { K.mouse.keys[e.code] = false; });
  const plane = new THREE.Plane(V(0,0,1), -(cfg.deskZ != null ? cfg.deskZ : -1)), _P = V(), _d = V(), SH = V(.3,1.05,.5);
  K.deskPoint = function(z){ K.mouse.ray.setFromCamera(K.mouse.ndc, camera); const pl = z == null ? plane : new THREE.Plane(V(0,0,1), -z); return K.mouse.ray.ray.intersectPlane(pl, _P) ? _P.clone() : null; };
  function deskPlace(dt){
    const H = K.R;
    if (cfg.desk){ cfg.desk(K, dt); return; }
    const p = K.deskPoint(); if (!p) return;
    const dir = _d.subVectors(p, SH).normalize();
    H.holder.position.copy(p).addScaledVector(dir, -(cfg.deskBack || 0));
    H.holder.lookAt(_c.copy(H.holder.position).sub(dir));
  }

  /* panels, menu, hud */
  K.panel = function(w,h,worldW,parent){
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(worldW, worldW*h/w), new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false, fog:false}));
    m.renderOrder = 10; (parent || scene).add(m); return {c,x,tex,m};
  };
  K.panelBg = function(p, border){ const {x,c} = p; x.clearRect(0,0,c.width,c.height); K.rr(x,6,6,c.width-12,c.height-12,28); x.fillStyle = 'rgba(10,10,24,.74)'; x.fill(); x.lineWidth = 4; x.strokeStyle = border || (cfg.colors && cfg.colors.accent) || '#7c5cff'; x.stroke(); x.direction = 'rtl'; x.textBaseline = 'alphabetic'; };
  const mp = cfg.menuPos || [0,1.95,-2.3];
  const titleP = K.panel(1024,300,2.0); titleP.m.position.set(...mp);
  const resP = K.panel(1024,560,2.0); resP.m.position.set(mp[0], mp[1]+.2, mp[2]);
  function drawTitle(){
    const {x,c} = titleP; x.clearRect(0,0,c.width,c.height); x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `400 150px ${F_DISP}`; x.shadowColor = (cfg.colors && cfg.colors.accent) || '#7c5cff'; x.shadowBlur = 28; x.fillStyle = (cfg.colors && cfg.colors.accent) || '#fff'; x.fillText(cfg.title, 512, 120); x.shadowBlur = 0;
    x.font = `600 40px ${F_BODY}`; x.fillStyle = '#ffffff'; x.fillText(cfg.menuHint || 'یک حالت را انتخاب کن: دسته را رویش بگیر و ماشه را بزن', 512, 250);
    titleP.tex.needsUpdate = true;
  }
  K.buttons = [];
  function makeButton(label, color, action, w=.62){
    const p = K.panel(320,110,w); const b = {p, label, color, action, hover:false};
    b.draw = () => { const {x} = p; x.clearRect(0,0,320,110); K.rr(x,6,6,308,98,22); x.fillStyle = b.hover ? color : 'rgba(10,10,24,.85)'; x.fill(); x.lineWidth = 5; x.strokeStyle = color; x.stroke();
      x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `400 54px ${F_DISP}`; x.fillStyle = b.hover ? '#0b0b16' : '#ffffff'; x.fillText(label, 160, 60); p.tex.needsUpdate = true; };
    b.draw(); p.m.userData.btn = b; K.buttons.push(b); return b;
  }
  const modeBtns = cfg.modes.map(md => makeButton(md.label, md.color || '#7c5cff', () => K.start(md.key)));
  const exitBtn = makeButton('→ فهرست بازی‌ها', '#8a8aa0', () => { location.href = cfg.hubUrl || '../index.html'; }, .62);
  const all = modeBtns.length;
  modeBtns.forEach((b,i) => b.p.m.position.set(mp[0] + ((all-1)/2 - i)*.7, mp[1]-.55, mp[2]+.05));
  exitBtn.p.m.position.set(mp[0], mp[1]-.95, mp[2]+.05);
  function showButtons(v){ modeBtns.forEach(b => b.p.m.visible = v); exitBtn.p.m.visible = v && cfg.hub !== false; }

  const hudL = K.panel(512,256,.9); const hp = cfg.hudPos || [-1.25,1.95,-2.1]; hudL.m.position.set(...hp); hudL.m.rotation.y = hp[0] < 0 ? .45 : -.45;
  const hudR = K.panel(512,256,.9); hudR.m.position.set(-hp[0], hp[1], hp[2]); hudR.m.rotation.y = -hudL.m.rotation.y;
  let hudKeyL = '', hudKeyR = '';
  function drawHud(p, label, value, l2, l3, col){
    K.panelBg(p); const {x} = p;
    x.textAlign = 'right'; x.fillStyle = '#b8b4d8'; x.font = `600 32px ${F_BODY}`; x.fillText(label || '', 476, 60);
    x.fillStyle = col || '#ffffff'; x.font = `400 104px ${F_DISP}`; x.fillText(value == null ? '' : value, 476, 168);
    x.fillStyle = '#d8d4f0'; x.font = `600 30px ${F_BODY}`; if (l2) x.fillText(l2, 476, 214); if (l3){ x.textAlign = 'left'; x.fillText(l3, 36, 60); }

  }
  K.hud = function(label, value, l2, l3, col){ const k = [label,value,l2,l3,col].join('|'); if (k === hudKeyL) return; hudKeyL = k; drawHud(hudL, label, value, l2, l3, col); };
  K.hudR = function(label, value, l2, l3, col){ const k = [label,value,l2,l3,col].join('|'); if (k === hudKeyR) return; hudKeyR = k; drawHud(hudR, label, value, l2, l3, col); hudR.m.userData.used = true; };
  K.hudPanels = [hudL, hudR];

  /* particles */
  const PN = 600;
  const pPos = new Float32Array(PN*3), pCol = new Float32Array(PN*3), pBase = new Float32Array(PN*3), pVel = new Float32Array(PN*3), pLife = new Float32Array(PN), pMax = new Float32Array(PN), pGrav = new Float32Array(PN);
  for (let i=0;i<PN;i++) pPos[i*3+1] = -999;
  const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3)); pGeo.setAttribute('color', new THREE.BufferAttribute(pCol,3));
  const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({size:.045, vertexColors:true, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, fog:false}));

<script>
// @title دوز

  tagline:'بازی قدیمی و همیشگی دوز، روی یک میز چوبی جلوی تو. سه مهره در یک ردیف بچین تا ببری. پنج دست در برابر رایانه.',
