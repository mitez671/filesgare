<script>
/* App kit: shared shell for the explore/learn apps (Quest WebXR). Exposes window.A */
(function(){
'use strict';
const A = window.A = {};
const V = A.V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
A.fa = n => Math.round(n).toLocaleString('fa-IR');
A.fa1 = (n, d=1) => (+n).toLocaleString('fa-IR', {maximumFractionDigits:d});
A.clamp = (v,a,b) => Math.max(a, Math.min(b, v));

A.F_DISP = 'Lalezar, Vazirmatn, Tahoma, sans-serif'; A.F_BODY = 'Vazirmatn, Tahoma, sans-serif';
A.cv = function(w,h,draw,rep){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; };
A.rr = function(x,X,Y,W,H,R){ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); };
A.wrap = function(x, text, maxW){ const out = []; for (const para of String(text || '').split('\n')){ let line = ''; for (const w of para.split(/\s+/)){ if (!w) continue; const t = line ? line + ' ' + w : w; if (x.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t; } out.push(line); } return out; };
A.json = async function(url, ms=15000, opt={}){ const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), ms); try { const r = await fetch(url, Object.assign({signal:ac.signal}, opt)); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); } finally { clearTimeout(tm); } };
A.tex = (url) => new Promise((res, rej) => new THREE.TextureLoader().setCrossOrigin('anonymous').load(url, res, undefined, rej));
A.say = function(text, lang='en-US'){ try { const u = new SpeechSynthesisUtterance(text); u.lang = lang; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){} };

/* ---------- globe helper (shared by the live-data apps) ---------- */
A.ll2v = function(lat, lon, r){ const ph = (lon + 180)*Math.PI/180, th = (90 - lat)*Math.PI/180; return new THREE.Vector3(-r*Math.sin(th)*Math.cos(ph), r*Math.cos(th), r*Math.sin(th)*Math.sin(ph)); };
A.makeGlobe = function(o={}){
  const r = o.r || .5, G = {r, scale:1, group:new THREE.Group(), spin:new THREE.Group()};
  G.group.position.set(...(o.pos || [0, 1.25, -1.1])); A.scene.add(G.group); G.group.add(G.spin);
  const mat = new THREE.MeshPhongMaterial({color:0xffffff, shininess:8}); A.tex('../_shared/earth.jpg').then(t => { mat.map = t; mat.needsUpdate = true; }).catch(() => { mat.color.setHex(0x2a6fd1); });
  G.earth = new THREE.Mesh(new THREE.SphereGeometry(r, 72, 48), mat); G.spin.add(G.earth);
  if (o.clouds !== false){ const cm = new THREE.MeshLambertMaterial({transparent:true, opacity:.35, depthWrite:false}); A.tex('../_shared/clouds.png').then(t => { cm.map = t; cm.alphaMap = t; cm.needsUpdate = true; }).catch(() => {}); G.clouds = new THREE.Mesh(new THREE.SphereGeometry(r*1.01, 48, 32), cm); G.spin.add(G.clouds); }
  const atm = new THREE.Mesh(new THREE.SphereGeometry(r*1.06, 48, 32), new THREE.MeshBasicMaterial({color:0x5fa8ff, transparent:true, opacity:.09, side:THREE.BackSide, depthWrite:false})); G.group.add(atm);
  G.v = (lat, lon, h=0) => A.ll2v(lat, lon, r*(1 + h));
  G.face = function(lat, lon){ // rotate so lat/lon faces the viewer
    G.spin.rotation.set(0, 0, 0); const v = A.ll2v(lat, lon, 1); const yaw = Math.atan2(v.x, v.z); G.spin.rotation.y = -yaw; const p = Math.asin(v.y); G.spin.rotation.x = p; };
  let grab = null; const _p = new THREE.Vector3();
  G.vr = function(dt, hs){
    for (const H of hs){ if (H.down.grip && !grab){ grab = {H, last:H.pos.clone()}; } }
    if (grab){ if (!grab.H.btn.grip){ grab = null; } else { _p.copy(grab.H.pos).sub(grab.last); G.spin.rotation.y += _p.x*5/G.scale; G.spin.rotation.x = A.clamp(G.spin.rotation.x - _p.y*5/G.scale, -1.4, 1.4); grab.last.copy(grab.H.pos); } }
    const R = A.R; if (R.ctrl && Math.abs(R.axes[1]) > .3){ G.setScale(G.scale*(1 - R.axes[1]*dt*1.2)); }

  G.drag = (dx, dy) => { G.spin.rotation.y += dx*.006/G.scale; G.spin.rotation.x = A.clamp(G.spin.rotation.x + dy*.006/G.scale, -1.4, 1.4); return true; };
  G.wheel = d => G.setScale(G.scale*(d > 0 ? .9 : 1.1));

  return G;
};
// point cloud of markers on the globe, pickable by angle from a ray
A.markers = function(G, list, colorOf, sizeOf){
  const n = list.length, pos = new Float32Array(n*3), col = new Float32Array(n*3), size = new Float32Array(n), c = new THREE.Color();
  list.forEach((m, i) => { const v = G.v(m.lat, m.lon, .02); pos.set([v.x, v.y, v.z], i*3); c.set(colorOf(m)); col.set([c.r, c.g, c.b], i*3); size[i] = sizeOf ? sizeOf(m) : 8; });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setAttribute('size', new THREE.BufferAttribute(size, 1));
  const mat = new THREE.ShaderMaterial({uniforms:{k:{value:1}}, transparent:true, depthWrite:false, vertexShader:'attribute float size; attribute vec3 color; varying vec3 vC; uniform float k; void main(){ vC = color; vec4 mv = modelViewMatrix*vec4(position,1.0); gl_PointSize = size*k*.0007*projectionMatrix[1][1]*600.0/ -mv.z; gl_Position = projectionMatrix*mv; }', fragmentShader:'varying vec3 vC; void main(){ float d = length(gl_PointCoord - .5); if (d > .5) discard; gl_FragColor = vec4(vC*(1.15 - d), smoothstep(.5,.35,d)); }'});
  const pts = new THREE.Points(g, mat); pts.frustumCulled = false; G.spin.add(pts);
  pts.userData.list = list;
  pts.nearest = function(o, d, maxAng = .03){ const w = new THREE.Vector3(), cam = new THREE.Vector3(); A.camera.getWorldPosition(cam); const center = new THREE.Vector3(); G.group.getWorldPosition(center); let best = null, bd = Math.cos(maxAng);
    for (let i=0;i<n;i++){ w.set(pos[i*3], pos[i*3+1], pos[i*3+2]).applyMatrix4(pts.matrixWorld); const nrm = w.clone().sub(center); if (nrm.dot(w.clone().sub(cam)) > 0) continue; const dir = w.clone().sub(o).normalize(), dt = dir.dot(d); if (dt > bd){ bd = dt; best = i; } } return best == null ? null : list[best]; };
  return pts;
};

/* ---------- circular photo gallery helper ---------- */
A.makeGallery = function(o={}){
  const Gy = {group:new THREE.Group(), frames:[], zoom:null}; A.scene.add(Gy.group);
  const R = o.radius || 3.2, frameMat = new THREE.MeshLambertMaterial({color:o.frame || 0x2a2018});
  const z = Gy.zoomGroup = new THREE.Group(); z.visible = false; A.scene.add(z);
  const dim = new THREE.Mesh(new THREE.SphereGeometry(2.5, 24, 16), new THREE.MeshBasicMaterial({color:0, transparent:true, opacity:.85, side:THREE.BackSide, depthWrite:false})); dim.renderOrder = 20; z.add(dim);
  const zp = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, depthTest:false})); zp.renderOrder = 21; z.add(zp);
  const zi = A.panel(1024, 300, 1.5, z); zi.m.renderOrder = 22; zi.m.material.depthTest = false;
  dim.userData.onClick = () => Gy.close(); zp.userData.onClick = () => Gy.close(); A.pickables.push(dim, zp);
  let zt = null;
  Gy.close = () => { z.visible = false; if (zt){ zt.dispose(); zt = null; } };
  Gy.open = function(it, tex){
    const h = new THREE.Vector3(); A.camera.getWorldPosition(h); const d = new THREE.Vector3(); A.camera.getWorldDirection(d); d.y = 0; d.normalize();
    z.position.copy(h); z.lookAt(h.clone().sub(d)); z.visible = true;
    const a = tex && tex.image ? tex.image.width/tex.image.height : 1.4; let w = 2, hh = w/a; if (hh > 1.4){ hh = 1.4; w = hh*a; }
    zp.scale.set(w, hh, 1); zp.position.set(0, .15, -1.6); zp.material.map = tex || null; zp.material.needsUpdate = true;
    zi.m.position.set(0, .15 - hh/2 - .25, -1.55); A.card(zi, it.title, it.desc || '', {size:26, sub:it.sub || '', titleSize:44});
    if (it.big && tex){ A.tex(it.big).then(t => { if (!z.visible || zp.material.map !== tex){ t.dispose(); return; } zt = t; zp.material.map = t; zp.material.needsUpdate = true; }).catch(() => {}); }
  };
  Gy.set = function(items){
    for (const f of Gy.frames){ A.dispose(f.g); if (f.tex) f.tex.dispose(); } Gy.frames = []; Gy.close();
    const n = items.length, rows = n > 12 ? 2 : 1, per = Math.ceil(n/rows);
    items.forEach((it, i) => { const row = Math.floor(i/per), k = i % per, ang = (k + .5)/per*Math.PI*2*(o.arc || 1) - Math.PI*(o.arc || 1) + Math.PI;
      const g = new THREE.Group(); g.position.set(Math.sin(ang)*R, rows === 1 ? 1.55 : (row ? 1.0 : 2.15), Math.cos(ang)*R); g.lookAt(0, g.position.y, 0); Gy.group.add(g);
      const fr = new THREE.Mesh(new THREE.BoxGeometry(1, 1, .04), frameMat); g.add(fr);
      const pic = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({color:0x222222})); pic.position.z = .025; g.add(pic);
      const f = {g, pic, fr, it, tex:null}; Gy.frames.push(f); const W = rows === 1 ? 1.1 : .95; const setSize = a => { let w = W, h = W/a; if (h > W*.85){ h = W*.85; w = h*a; } pic.scale.set(w, h, 1); fr.scale.set(w + .08, h + .08, 1); }; setSize(1.4);
      pic.userData.onClick = () => Gy.open(it, f.tex); A.pickables.push(pic);
      A.tex(it.src).then(t => { if (!Gy.frames.includes(f)){ t.dispose(); return; } f.tex = t; pic.material.map = t; pic.material.color.setHex(0xffffff); pic.material.needsUpdate = true; setSize(t.image.width/t.image.height); }).catch(() => { pic.material.color.setHex(0x553333); });
    });
  };
  return Gy;
};

/* ---------- audio ---------- */
A.audio = function(){ if (!A.ac){ A.ac = new (window.AudioContext || window.webkitAudioContext)(); A.out = A.ac.createGain(); A.out.gain.value = .8; A.out.connect(A.ac.destination); A.noiseBuf = A.ac.createBuffer(1, A.ac.sampleRate*2, A.ac.sampleRate); const d = A.noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; } if (A.ac.state === 'suspended') A.ac.resume(); return A.ac; };
A.tone = function(f, dec=.2, type='sine', peak=.15, f2){ if (!A.ac) return; const t = A.ac.currentTime, o = A.ac.createOscillator(), g = A.ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dec); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + dec); o.connect(g); g.connect(A.out); o.start(t); o.stop(t + dec + .05); };
A.click = () => A.tone(900, .06, 'triangle', .1, 1300);

/* ---------- UI shell ---------- */
function injectUI(cfg){
  const c = Object.assign({bg:'#0c1018', ink:'#eef2f7', muted:'#a3adbd', accent:'#4fb3ff', accent2:'#ffb84f'}, cfg.colors || {});
  const st = document.createElement('style');
  st.textContent = `:root{--bg:${c.bg};--ink:${c.ink};--muted:${c.muted};--accent:${c.accent};--accent2:${c.accent2};--panel:rgba(10,14,22,.86);--line:rgba(255,255,255,.16);--display:Lalezar,Vazirmatn,Tahoma,sans-serif;--body:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{height:100%}body{margin:0;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0}#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{position:fixed;inset:0;overflow:auto;display:grid;place-items:center;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.card{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;text-align:right}
.back{align-self:flex-start;color:var(--muted);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 12px}.back:hover{color:var(--ink);border-color:var(--accent)}
.eyebrow{margin:0;color:var(--muted);font-size:13px}
h1{margin:0;font:400 clamp(48px,13vw,88px)/1.05 var(--display);color:var(--accent)}
.lede{margin:0;font-size:15.5px;line-height:1.9;max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:600 15px/1 var(--body);color:var(--ink);background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer}.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.back:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06101c;font-weight:800}.btn[disabled]{opacity:.4;cursor:not-allowed}
.note{margin:0;font-size:13px;line-height:1.8;color:var(--muted);border-right:3px solid var(--accent);padding-right:10px}.note a{color:var(--ink)}
.how{margin:0;padding:0 18px 0 0;font-size:14px;line-height:1.8}
#bMenu{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));font:600 14px/1 var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}
#status{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px));max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--muted);pointer-events:none}
#deskui{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:120px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;direction:rtl}

  document.head.appendChild(st);
  const stage = document.createElement('div'); stage.id = 'stage'; document.body.appendChild(stage);
  const ov = document.createElement('div'); ov.id = 'ov'; ov.dir = 'rtl';
  ov.innerHTML = `<main class="card"><a class="back" href="../index.html">→ همهٔ بازی‌ها و برنامه‌ها</a><p class="eyebrow">${cfg.eyebrow || 'برنامهٔ واقعیت مجازی برای Meta Quest'}</p><h1>${cfg.title}</h1><p class="lede">${cfg.tagline}</p>
  <div class="actions"><button id="bVR" class="btn primary" type="button" disabled>ورود به واقعیت مجازی</button><button id="bDesk" class="btn" type="button">${cfg.deskLabel || 'دیدن با موس'}</button></div>
  <ul class="how">${(cfg.rules || []).map(r => '<li>' + r + '</li>').join('')}<li>در VR: دکمهٔ B یا Y منو را باز می‌کند و از آنجا به صفحهٔ اول برمی‌گردی.</li>${cfg.deskRules ? '<li>با موس: ' + cfg.deskRules + '</li>' : ''}</ul>

A.init = function(cfg){
  A.cfg = cfg;
  const stage = injectUI(cfg);
  const renderer = A.renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true; renderer.xr.setReferenceSpaceType('local-floor');
  stage.appendChild(renderer.domElement);
  const scene = A.scene = new THREE.Scene(); scene.background = new THREE.Color(cfg.bg != null ? cfg.bg : 0x0c1018);
  if (cfg.fog) scene.fog = new THREE.Fog(cfg.bg != null ? cfg.bg : 0x0c1018, cfg.fog[0], cfg.fog[1]);
  const rig = A.rig = new THREE.Group(); scene.add(rig);
  const camera = A.camera = new THREE.PerspectiveCamera(cfg.fov || 65, innerWidth/innerHeight, cfg.near || .05, cfg.far || 2000); camera.position.set(0, 1.6, 0); rig.add(camera);
  if (cfg.lights !== false){ A.hemi = new THREE.HemisphereLight(0xeef3ff, 0x30302c, .9); scene.add(A.hemi); A.sun = new THREE.DirectionalLight(0xffffff, .7); A.sun.position.set(3, 8, 4); scene.add(A.sun); }
  const start = cfg.start || [0, 0, 0];
  A.home = () => { rig.position.set(start[0], start[1], start[2]); rig.rotation.set(0, cfg.startYaw || 0, 0); A.look.yaw = 0; A.look.pitch = 0; };
  A.look = {yaw:0, pitch:0}; A.home();
  A.head = V(); A.headDir = V();
  A.pickables = [];   // meshes with userData.onClick(hitPoint, hand) and optional userData.onHover(bool)
  A.bounds = cfg.bounds || null; // {x0,x1,z0,z1}
  A.flyY = cfg.move === 'fly';

  /* head-locked status panel (VR) */
  const sc = document.createElement('canvas'); sc.width = 1024; sc.height = 96; const stex = new THREE.CanvasTexture(sc);
  const sm = new THREE.Mesh(new THREE.PlaneGeometry(.9, .9*96/1024), new THREE.MeshBasicMaterial({map:stex, transparent:true, depthTest:false, depthWrite:false, fog:false})); sm.renderOrder = 60; sm.position.set(0, -.36, -1); sm.visible = false; camera.add(sm);
  let statusText = '', statusT = 0;
  A.status = function(text, secs=0){
    statusText = text || ''; statusT = secs; const el = document.getElementById('status'); el.textContent = statusText; el.hidden = !statusText || A.mode !== 'desk';
    const x = sc.getContext('2d'); x.clearRect(0,0,1024,96); if (statusText){ x.font = '600 38px ' + A.F_BODY; const w = Math.min(1000, x.measureText(statusText).width + 60); A.rr(x, 512 - w/2, 10, w, 76, 30); x.fillStyle = 'rgba(10,14,22,.85)'; x.fill(); x.fillStyle = '#eef2f7'; x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(statusText, 512, 50); }
    stex.needsUpdate = true; sm.visible = !!statusText && A.mode === 'vr';
  };

  /* panels & buttons */
  A.panel = function(w, h, worldW, parent){
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(worldW, worldW*h/w), new THREE.MeshBasicMaterial({map:tex, transparent:true, fog:false}));
    (parent || scene).add(m); return {c, x, tex, m, W:w, H:h};
  };
  A.card = function(p, title, body, opt={}){   // draws an RTL info card on a panel
    const {x, c} = p; x.clearRect(0,0,c.width,c.height); A.rr(x,4,4,c.width-8,c.height-8,26); x.fillStyle = opt.bg || 'rgba(10,14,22,.9)'; x.fill(); x.lineWidth = 4; x.strokeStyle = opt.border || (cfg.colors && cfg.colors.accent) || '#4fb3ff'; x.stroke();
    x.direction = 'rtl'; x.textAlign = 'right'; x.textBaseline = 'alphabetic'; const pad = 36; let y = 0;
    if (title){ x.fillStyle = opt.titleColor || (cfg.colors && cfg.colors.accent) || '#4fb3ff'; x.font = `400 ${opt.titleSize || 64}px ${A.F_DISP}`; y = (opt.titleSize || 64) + 22; x.fillText(title, c.width - pad, y); }
