<title>زمین‌نما</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;800&display=swap">
<style>

:root{--bg:#0b1220;--ink:#eef3fb;--muted:#9fb0c8;--panel:rgba(12,20,36,.86);--line:rgba(160,190,230,.22);--accent:#3fb6ff;--accent2:#ffc857;
--display:Lalezar,Vazirmatn,Tahoma,sans-serif;--body:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--panel),rgba(12,20,36,.55));border-bottom:1px solid var(--line)}
.brand{font:400 26px/1 var(--display);color:var(--accent);margin-left:6px;white-space:nowrap}
.search{position:relative;flex:1 1 220px;min-width:0;display:flex}

.search input:focus{outline:2px solid var(--accent);outline-offset:1px}

#results button:hover{background:rgba(63,182,255,.14)}

select{max-width:200px}
.btn:hover,select:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.btn.on{background:var(--accent);border-color:var(--accent);color:#06121f}
.btn.vr{background:var(--accent2);border-color:var(--accent2);color:#1d1404;font-weight:800}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.seg{display:flex;gap:4px}

  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.7;color:var(--muted)}
#status b{color:var(--ink);font-weight:600}
#help{position:fixed;bottom:calc(36px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));max-width:min(360px,calc(100% - 24px));

  if (!navigator.geolocation){ $('#status').textContent = 'مرورگر موقعیت‌یابی ندارد.'; return; }
  $('#status').textContent = 'در حال گرفتن موقعیت…';
  navigator.geolocation.getCurrentPosition(p => enterCity(p.coords.latitude, p.coords.longitude, 'موقعیت من', 1/1500), err => { $('#status').textContent = 'موقعیت در دسترس نیست: ' + (err.code === 1 ? 'اجازه داده نشد' : 'خطا'); }, {enableHighAccuracy:true, timeout:10000});
};
let lastSearch = 0;
$('#searchForm').addEventListener('submit', async e => {
  e.preventDefault(); const q = $('#q').value.trim(); const box = $('#results'); if (!q) return;
  const wait = 1100 - (performance.now() - lastSearch); if (wait > 0) await new Promise(r => setTimeout(r, wait)); lastSearch = performance.now();
  box.hidden = false; box.innerHTML = '<button type="button" disabled>در حال جستجو…</button>';
  try {
    const r = await fetch(NOMINATIM + '?format=jsonv2&limit=6&accept-language=fa&q=' + encodeURIComponent(q)); const js = await r.json();
    if (!js.length){ box.innerHTML = '<button type="button" disabled>نتیجه‌ای پیدا نشد</button>'; return; }
    box.innerHTML = ''; js.forEach(it => { const b = document.createElement('button'); b.type = 'button'; b.textContent = it.display_name; b.onclick = () => { box.hidden = true; const short = it.name || it.display_name.split('،')[0].split(',')[0]; enterCity(+it.lat, +it.lon, short, it.type === 'city' || it.type === 'administrative' ? 1/12000 : 1/2500); }; box.appendChild(b); });
  } catch(err){ box.innerHTML = '<button type="button" disabled>جستجو ممکن نشد (اتصال به Nominatim)</button>'; }
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('.search')) $('#results').hidden = true; });
async function reverseName(lat, lon){
  try { const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=fa&lat=' + lat + '&lon=' + lon); const js = await r.json(); const a = js.address || {}; const n = a.suburb || a.neighbourhood || a.city || a.town || a.village || a.county || a.state || js.name || ''; if (n && Math.abs(view.lat0 - lat) < 1e-6){ view.name = n; drawName(); updateStatus(); } } catch(e){}
}

/* ================= VR session ================= */
const bVR = $('#bVR');
(async () => { let ok = false; try { ok = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-vr')); } catch(e){} bVR.disabled = !ok; if (!ok) bVR.title = 'این مرورگر WebXR ندارد. صفحه را در مرورگر کوئست باز کن.'; })();
bVR.onclick = async () => {
  try {
    const session = await navigator.xr.requestSession('immersive-vr', {optionalFeatures:['local-floor','bounded-floor']});
    await renderer.xr.setSession(session); if (renderer.xr.setFoveation) renderer.xr.setFoveation(1);
    if (mode !== 'street'){ rig.position.set(0,0,0); rig.rotation.set(0,0,0); }
    session.addEventListener('end', () => { renderer.setSize(innerWidth, innerHeight); deskCamReset(); });
  } catch(e){ $('#status').textContent = 'ورود به VR انجام نشد: ' + (e && e.message || e); }
};

/* ================= loop ================= */
const clock = new THREE.Clock(); let tileTimer = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  if (renderer.xr.isPresenting) vrUpdate(dt); else { deskUpdate(dt); for (const H of hands) if (H.ctrl) H.ctrl.userData.line.visible = false; }
  board.visible = mode !== 'street'; board.position.set(mode === 'globe' ? -.95 : -1.0, 1.25, mode === 'globe' ? -.75 : -.6);
  applyCityTransform();
  tileTimer -= dt; if (tileTimer <= 0){ tileTimer = .25; updateTiles(); labelTimer++; if (labelsDirty || labelTimer % 2 === 0){ updateLabels(); labelsDirty = false; } if (mode === 'street') updateStatus(); }
  if (mode === 'globe'){ const cp = V(); camera.getWorldPosition(cp); const dir = cp.sub(globe.position).normalize(); const inv = globeSpin.getWorldQuaternion(new THREE.Quaternion()); for (const s of labelGroup.children){ const n = s.userData.n.clone().applyQuaternion(inv); s.visible = n.dot(dir) > .25 && globe.scale.x > .9; } }
  if (hintDirty && renderer.xr.isPresenting){ drawHint(); hintDirty = false; }
  renderer.render(scene, camera);
});

/* ================= start ================= */
updateHelp(); setMode('globe'); drawName();
(async () => {
  try {
    const r = await fetch(TILEJSON); if (!r.ok) throw new Error('HTTP ' + r.status); const tj = await r.json();
    TILE_URL = tj.tiles[0]; updateStatus(); loadGlobe();
    const hash = location.hash.slice(1).split(','); if (hash.length >= 2 && !isNaN(+hash[0])) enterCity(+hash[0], +hash[1], decodeURIComponent(hash[2] || ''));
  } catch(e){
    $('#status').innerHTML = '<b>اتصال به سرور نقشه ممکن نشد.</b> اینترنت را بررسی کن؛ اگر tiles.openfreemap.org فیلتر است، این برنامه بدون آن داده‌ای نشان نمی‌دهد.';
  }
})();
Promise.all([document.fonts.load('600 40px Vazirmatn', 'تهران ۱۲۳'), document.fonts.load('400 40px Lalezar', 'میز شهر')]).catch(() => {}).then(() => { hintKey = ''; hintDirty = true; drawName(); boardBtns.forEach(m => m.userData.btn.b.draw(false)); labelCache.clear(); labelsDirty = true; });
window.__map = {setMode, enterCity, enterStreet, view, tiles, labelSprites, get mode(){ return mode; }};
})();
</script>
</body>
</html>
