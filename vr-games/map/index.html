<!doctype html>
<html lang="fa" dir="rtl">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>زمین‌نما</title>
<meta name="description" content="نقشهٔ سه‌بعدی زمین برای واقعیت مجازی: از کرهٔ زمین پیوسته تا خیابان و ساختمان‌ها زوم کن، با داده‌های OpenStreetMap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;800&display=swap">
<style>

:root{--bg:#0b1220;--ink:#eef3fb;--muted:#9fb0c8;--panel:rgba(12,20,36,.86);--line:rgba(160,190,230,.22);--accent:#3fb6ff;--accent2:#ffc857;
--display:Lalezar,Vazirmatn,Tahoma,sans-serif;--body:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;

#results button:hover{background:rgba(63,182,255,.14)}

select{max-width:200px}
.btn:hover,select:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,.hub:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.btn.on{background:var(--accent);border-color:var(--accent);color:#06121f}
.btn.vr{background:var(--accent2);border-color:var(--accent2);color:#1d1404;font-weight:800}

.attrib a{color:var(--muted)}

</style>

  const latc = y2lat((y+.5)*256, z), lonc = x2lon((x+.5)*256, z), S = EARTH*Math.cos(latc*D2R)/n;
  runJob({url:tileUrl(z,x,y), z, px, mpp:S/px, S, tex:true, bld}).then(res => {

    if (keys.KeyW || keys.ArrowUp) pan(f.clone().multiplyScalar(-sp)); if (keys.KeyS || keys.ArrowDown) pan(f.clone().multiplyScalar(sp));
    if (keys.KeyA || keys.ArrowLeft) pan(r.clone().multiplyScalar(sp)); if (keys.KeyD || keys.ArrowRight) pan(r.clone().multiplyScalar(-sp));
    if (keys.Equal || keys.NumpadAdd || keys.KeyE) E.R = clamp(E.R*Math.exp(dt*1.5), R_MIN, R_MAX); if (keys.Minus || keys.NumpadSubtract || keys.KeyQ) E.R = clamp(E.R*Math.exp(-dt*1.5), R_MIN, R_MAX);
  }
}

/* ================= UI ================= */
function updateHelp(){
  $('#help').innerHTML = mode === 'earth' ? '<b>زمین:</b> بکش تا جابه‌جا شود، چرخ موس زوم تا خیابان، کلیک راست و بکش برای چرخش. دوبار کلیک: از دور پرواز به آنجا، از نزدیک رفتن به خیابان.'
    : '<b>خیابان:</b> W، A، S و D برای راه رفتن، Shift سریع، E و Q بالا و پایین، کشیدن موس برای نگاه. Esc: برگشت به زمین.';
}
function updateStatus(){
  const s = $('#status'); if (!TILE_URL) return;
  let t = placeName ? '<b>' + placeName + '</b> · ' : '';
  if (mode === 'earth') t += frame.k > 2e6 ? 'کره را بچرخان یا زوم کن' : 'مقیاس ۱:' + fa(frame.k) + ' · بزرگنمایی ' + fa(eZ);
  else t += 'ارتفاع دید ' + fa(rig.position.y + 1.7) + ' متر';
  if (inflight) t += ' · بارگذاری ' + fa(inflight); if (tileErr) t += ' · ' + fa(tileErr) + ' خطا';
  s.innerHTML = t; hintDirty = true;
}
const presetSel = $('#preset');
PRESETS.forEach((p,i) => { const o = document.createElement('option'); o.value = i; o.textContent = p[0]; presetSel.appendChild(o); });
presetSel.addEventListener('change', () => { const p = PRESETS[+presetSel.value]; if (p){ if (mode !== 'earth') setMode('earth'); flyTo(p[1], p[2], RE/2500, p[0]); } presetSel.value = ''; });
$('#mEarth').onclick = () => { if (mode === 'street') streetToEarth(); };
$('#mStreet').onclick = () => { if (mode === 'earth') enterStreet(E.lat, E.lon); };
$('#bLabels').onclick = toggleLabels;
$('#bLoc').onclick = () => {
  if (!navigator.geolocation){ $('#status').textContent = 'مرورگر موقعیت‌یابی ندارد.'; return; }
  $('#status').textContent = 'در حال گرفتن موقعیت…';
  navigator.geolocation.getCurrentPosition(p => { if (mode !== 'earth') setMode('earth'); flyTo(p.coords.latitude, p.coords.longitude, RE/1500, 'موقعیت من'); }, err => { $('#status').textContent = 'موقعیت در دسترس نیست: ' + (err.code === 1 ? 'اجازه داده نشد' : 'خطا'); }, {enableHighAccuracy:true, timeout:10000});
};
let lastSearch = 0;
$('#searchForm').addEventListener('submit', async e => {
  e.preventDefault(); const q = $('#q').value.trim(); const box = $('#results'); if (!q) return;
  const wait = 1100 - (performance.now() - lastSearch); if (wait > 0) await new Promise(r => setTimeout(r, wait)); lastSearch = performance.now();
  box.hidden = false; box.innerHTML = '<button type="button" disabled>در حال جستجو…</button>';
  try {
    const r = await fetch(NOMINATIM + 'search?format=jsonv2&limit=6&accept-language=fa&q=' + encodeURIComponent(q)); const js = await r.json();
    if (!js.length){ box.innerHTML = '<button type="button" disabled>نتیجه‌ای پیدا نشد</button>'; return; }
    box.innerHTML = ''; js.forEach(it => { const b = document.createElement('button'); b.type = 'button'; b.textContent = it.display_name; b.onclick = () => { box.hidden = true; const short = it.name || it.display_name.split('،')[0].split(',')[0]; if (mode !== 'earth') setMode('earth'); flyTo(+it.lat, +it.lon, RE/(['city','administrative','state','country'].includes(it.type) ? 25000 : 2500), short); }; box.appendChild(b); });
  } catch(err){ box.innerHTML = '<button type="button" disabled>جستجو ممکن نشد (اتصال به Nominatim)</button>'; }
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('.search')) $('#results').hidden = true; });
async function reverseName(lat, lon){
  try { const r = await fetch(NOMINATIM + 'reverse?format=jsonv2&zoom=12&accept-language=fa&lat=' + lat + '&lon=' + lon); const js = await r.json(); const a = js.address || {}; const n = a.city || a.town || a.suburb || a.village || a.county || a.state || a.country || js.name || ''; if (n){ placeName = n; drawName(); updateStatus(); } } catch(e){}
}

/* ================= VR session (also auto-enter when navigated from the hub in VR) ================= */
const bVR = $('#bVR');
async function enterVR(){
  try {
    const session = await navigator.xr.requestSession('immersive-vr', {optionalFeatures:['local-floor','bounded-floor']});
    await renderer.xr.setSession(session); if (renderer.xr.setFoveation) renderer.xr.setFoveation(1);
    if (mode === 'earth'){ rig.position.set(0,0,0); rig.rotation.set(0,0,0); }
    session.addEventListener('end', () => { renderer.setSize(innerWidth, innerHeight); deskCamReset(); });
  } catch(e){ $('#status').textContent = 'ورود به VR انجام نشد: ' + (e && e.message || e); }
}
(async () => { let ok = false; try { ok = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-vr')); } catch(e){} bVR.disabled = !ok; })();
bVR.onclick = enterVR;
if (navigator.xr) navigator.xr.addEventListener('sessiongranted', () => { if (!renderer.xr.isPresenting) enterVR(); });

/* ================= loop ================= */
const clock = new THREE.Clock(); let tileTimer = 0, labelTimer = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  if (renderer.xr.isPresenting) vrUpdate(dt); else { deskUpdate(dt); for (const H of hands) if (H.ctrl) H.ctrl.userData.line.visible = false; }
  if (mode === 'earth'){
    stepFly(dt);
    if (!renderer.xr.isPresenting && !drag && !fly && E.R < .6) E.lon = ((E.lon - dt*1.5 + 540) % 360) - 180;
    updateEarthFrame();
    if (!renderer.xr.isPresenting) deskEarthCam();
    floorG.visible = frame.t < .15; atmo.visible = frame.t < .6;
    scene.fog = frame.t > .55 ? (scene.fog && scene.fog.near === 2.6 ? scene.fog : new THREE.Fog(0x0b1220, 2.6, 5.2)) : null;
    nameP.m.visible = frame.t > .4;
  } else { scene.fog = scene.fog && scene.fog.near === 700 ? scene.fog : new THREE.Fog(0xd8e6f1, 700, 3200); nameP.m.visible = false; }
  tileTimer -= dt;
  if (tileTimer <= 0){ tileTimer = .25; if (mode === 'earth') updateEarthTiles(); else updateStreetTiles(); updateStatus(); }
  labelTimer -= dt;
  if (labelTimer <= 0){ labelTimer = .2; layoutLabels(mode === 'earth' ? earthLabelCands() : streetLabelCands()); }
  if (hintDirty && renderer.xr.isPresenting){ drawHint(); hintDirty = false; }
  renderer.render(scene, camera);
});

/* ================= start ================= */
updateHelp(); setMode('earth'); updateEarthFrame(); drawName();
(async () => {
  try {
    const r = await fetch(TILEJSON); if (!r.ok) throw new Error('HTTP ' + r.status); const tj = await r.json();
    TILE_URL = tj.tiles[0]; updateStatus(); loadBase();
    const hash = location.hash.slice(1).split(','); if (hash.length >= 2 && !isNaN(+hash[0])) flyTo(+hash[0], +hash[1], RE/2500, decodeURIComponent(hash[2] || ''));
  } catch(e){
    $('#status').innerHTML = '<b>اتصال به سرور نقشه ممکن نشد.</b> اینترنت را بررسی کن؛ اگر tiles.openfreemap.org فیلتر است، این برنامه بدون آن داده‌ای نشان نمی‌دهد.';
  }
})();
Promise.all([document.fonts.load('600 40px Vazirmatn', 'تهران ۱۲۳'), document.fonts.load('400 40px Lalezar', 'زمین')]).catch(() => {}).then(() => { hintKey = ''; hintDirty = true; drawName(); boardBtns.forEach(m => m.userData.btn.b.draw(false)); for (const s of labelCache.values()){ s.material.map.dispose(); s.material.dispose(); } labelCache.clear(); });
window.__map = {E, frame, setMode, enterStreet, flyTo, eTiles, sTiles, labelGroup, get mode(){ return mode; }};
})();
</script>
